<mat-toolbar class="header">
  <button
  matIconButton
  class="button home-button"
  aria-label="Menu icon-button with home icon"
  (click)="navigateToLanding()"
  >
    <mat-icon>home</mat-icon>
  </button>

  <span>Shawn Hartline</span>

  <span class="header-spacer"></span>
  <div class="contact-btns-container">

    <button
      matIconButton
      class="button github"
      aria-label="github icon-button with github icon"
      matTooltip="Vist Github"
      (click)="openGithub()"
    >
      <mat-icon svgIcon="github" />
    </button>

    <button
      matIconButton
      class="button email-button"
      aria-label="email icon-button with email icon"
      matTooltip="Visit LinkedIn"
      (click)="openLinkedIn()"
    >
      <mat-icon svgIcon="linkedIn"/>
    </button>

    <button
      matIconButton
      class="button email-button"
      aria-label="email icon-button with email icon"
      matTooltip="Copy Email"
      cdkCopyToClipboard="hartline.codes@gmail.com"
      (click)="openSnackBar()"
    >
      <mat-icon>mail</mat-icon>
    </button>
  </div>
</mat-toolbar>
